<script>
  function normalizeClinicKeyJS_(name) {
    return stripClinicPrefix_(name)
      .replace(/ヶ/g, "ケ")
      .replace(/が丘/g, "ヶ丘");
  }

  function getDynamicSheetOrder_(y, m) {
    var available = Object.keys(STATE.wageTables || {});
    var fiscalYear = (m >= 1 && m <= 3) ? (y - 1) : y;
    var halfLabel = (m >= 4 && m <= 9) ? "上期" : "下期";

    var preferred = [
      fiscalYear + halfLabel + "時給",
      y + halfLabel + "時給",
      "関西拠点時給",
      fiscalYear + "時給",
      y + "時給"
    ];

    var result = [];
    preferred.forEach(function(p) {
      if (available.indexOf(p) !== -1 && result.indexOf(p) === -1) {
        result.push(p);
      }
    });

    available.slice().sort().reverse().forEach(function(s) {
      if (result.indexOf(s) === -1) result.push(s);
    });
    return result;
  }

  function findClinicWageRow_(table, clinicName, dept) {
    if (!table || !clinicName) return null;
    var cleanC = stripClinicPrefix_(clinicName);
    var normC = normalizeClinicKeyJS_(cleanC);
    var d = (dept === "内科") ? "内科" : "小児科";
    var hasInt = clinicHasInternalMedicineJS_(cleanC);

    var strictKeys = [
      cleanC + "|" + d,
      cleanC + "(" + d + ")",
      cleanC + "（" + d + "）"
    ];
    for (var i = 0; i < strictKeys.length; i++) {
      if (table[strictKeys[i]]) return table[strictKeys[i]];
    }

    var allKeys = Object.keys(table);
    for (var j = 0; j < allKeys.length; j++) {
      var k = allKeys[j];
      var kBase = normalizeClinicKeyJS_(k.split("|")[0]);
      var isDeptMatch = (k.indexOf("|" + d) !== -1 || k.indexOf("(" + d + ")") !== -1 || k.indexOf("（" + d + "）") !== -1);
      if (isDeptMatch && (kBase === normC || kBase.indexOf(normC) === 0 || normC.indexOf(kBase) === 0)) {
        return table[k];
      }
    }

    if (hasInt) return null;

    if (table[cleanC]) return table[cleanC];
    for (var m = 0; m < allKeys.length; m++) {
      var k2 = allKeys[m];
      var k2Base = normalizeClinicKeyJS_(k2.split("|")[0]);
      if (k2Base === normC || (k2Base && normC && (k2Base.indexOf(normC) === 0 || normC.indexOf(k2Base) === 0))) {
        return table[k2];
      }
    }
    return null;
  }

  function getWageRowFromAllTables_(clinic, dept, y, m) {
    var order = getDynamicSheetOrder_(y, m);
    for (var i = 0; i < order.length; i++) {
      var sName = order[i];
      var tbl = STATE.wageTables[sName];
      var row = findClinicWageRow_(tbl, clinic, dept);
      if (row) return { row: row, sheetName: sName };
    }
    return null;
  }

  function getDayCategoryInfo_(dateStr) {
    var ym = String(dateStr || "2026/10/25").split("/");
    var y = Number(ym[0] || 2026), m = Number(ym[1] || 10), d = Number(ym[2] || 1);
    var dObj = new Date(y, m - 1, d);
    var dow = dObj.getDay();
    var dayCat = (STATE.holidays.has(dateStr) || dow === 0) ? "sunHol" : (dow === 6 ? "sat" : "weekday");
    var dayLabel = dayCat === "sunHol" ? "日祝" : (dayCat === "sat" ? "土曜" : "平日");
    return { y: y, m: m, d: d, dayCat: dayCat, dayLabel: dayLabel };
  }

  function toMin(hhmm) {
    var m = String(hhmm || "").match(/^(\d{1,2}):(\d{2})/);
    if (!m) return NaN;
    return Number(m[1]) * 60 + Number(m[2]);
  }

  function updateHourlyInputVisibility_() {
    var clinic = stripClinicPrefix_(document.getElementById("clinicSelect").value);
    var isKita = (clinic === "北葛西");
    var absTime = document.getElementById("absenceTimeInput").value || "";
    var conTime = document.getElementById("consultTimeInput").value || absTime;
    var checkRange = (conTime && conTime.indexOf("-") !== -1) ? conTime : absTime;

    var hasAm = false, hasPm = false, hasNight = false;
    if (checkRange && checkRange.indexOf("-") !== -1) {
      var parts = checkRange.split("-");
      var sMin = toMin(parts[0]), eMin = toMin(parts[1]);
      if (!isNaN(sMin) && !isNaN(eMin) && eMin > sMin) {
        var amEnd = isKita ? (12 * 60 + 30) : (13 * 60);
        var pmStart = isKita ? (14 * 60) : (15 * 60);
        for (var t = sMin; t < eMin; t += 15) {
          if (t < amEnd) hasAm = true;
          else if (t >= pmStart && t < 18 * 60) hasPm = true;
          else if (t >= 18 * 60) hasNight = true;
        }
      }
    }

    if (!hasAm && !hasPm && !hasNight) {
      hasAm = true; hasPm = true; hasNight = true;
    }

    document.getElementById("wrapRateAm").style.display = hasAm ? "block" : "none";
    document.getElementById("wrapRatePm").style.display = hasPm ? "block" : "none";
    document.getElementById("wrapRateNight").style.display = hasNight ? "block" : "none";
  }

  function onTimeRangeChanged() {
    updateHourlyInputVisibility_();
    recalcFromHourlyInputs();
  }

  function onClinicOrDeptChange() {
    var item = STATE.confirmItems[STATE.selectedIdx];
    if (!item) return;

    updateDeptButtonsByClinic_();

    var clinic = stripClinicPrefix_(document.getElementById("clinicSelect").value);
    var curAbs = document.getElementById("absenceTimeInput").value;
    if (clinic === "北葛西" && curAbs.indexOf("21:00") !== -1) {
      document.getElementById("absenceTimeInput").value = curAbs.replace("21:00", "20:00");
      document.getElementById("consultTimeInput").value = document.getElementById("absenceTimeInput").value;
    }

    var normClinic = normalizeClinicKeyJS_(clinic);
    var d6Matches = STATE.d6Data.filter(function(d) {
      var dBase = normalizeClinicKeyJS_(d.baseClinic);
      return d.dateStr === item.dateStr && (dBase === normClinic || dBase.indexOf(normClinic) === 0 || normClinic.indexOf(dBase) === 0) && d.dept === STATE.dept;
    });

    if (d6Matches.length > 0) {
      var d6Hit = d6Matches[0];
      if (d6Hit.absenceTime && !document.getElementById("absenceTimeInput").value) {
        document.getElementById("absenceTimeInput").value = d6Hit.absenceTime;
      }
      if (STATE.approachType === "勤務地変更相談" && document.getElementById("currentTimeInput").value) {
        // 勤務地変更相談時は特段の指定がない限り現在シフト（例:09:00-21:00）をまるごと移動として引き継ぐ
        document.getElementById("consultTimeInput").value = document.getElementById("currentTimeInput").value;
      } else if (d6Hit.absenceTime && !document.getElementById("currentTimeInput").value) {
        document.getElementById("consultTimeInput").value = d6Hit.absenceTime;
      }
      if (d6Matches.some(function(m) { return m.isSpecialWage; })) {
        document.getElementById("specialWageCheck").checked = true;
      }
    }

    filterDoctorCandidates();
    recalcAll();
  }

  function getSlotRateJS_(tMin, rates, isKita) {
    if (!rates) return 0;
    if (isKita) {
      if (tMin < 12 * 60 + 30) return Number(rates.am || 0);
      if (tMin >= 14 * 60 && tMin < 18 * 60) return Number(rates.pm || 0);
      if (tMin >= 18 * 60) return Number(rates.night || 0);
      return Number(rates.am || 0);
    }
    if (tMin < 13 * 60) return Number(rates.am || 0);
    if (tMin >= 15 * 60 && tMin < 18 * 60) return Number(rates.pm || 0);
    if (tMin >= 18 * 60) return Number(rates.night || 0);
    return Number(rates.am || 0);
  }

  function calcIntervalYen(rangeStr, rates, isKita, spRangeStr, spBonus) {
    if (!rangeStr || rangeStr.indexOf("-") === -1 || !rates) return 0;
    var parts = rangeStr.split("-");
    var sMin = toMin(parts[0]), eMin = toMin(parts[1]);
    if (isNaN(sMin) || isNaN(eMin) || eMin <= sMin) return 0;

    var spS = -1, spE = -1;
    if (spRangeStr && spRangeStr.indexOf("-") !== -1 && spBonus > 0) {
      var spP = spRangeStr.split("-");
      spS = toMin(spP[0]); spE = toMin(spP[1]);
    } else if (spBonus > 0) {
      spS = sMin; spE = eMin;
    }

    var total = 0;
    for (var t = sMin; t < eMin; t += 15) {
      if (t >= 13 * 60 && t < 15 * 60) continue;
      var base = getSlotRateJS_(t, rates, isKita);
      var bonus = (spS !== -1 && t >= spS && t < spE) ? spBonus : 0;
      total += (base + bonus) * 0.25;
    }
    return Math.round(total);
  }

  /**
   * 勤務地変更相談（移動）専用の日給計算：
   * 15分刻みで「移動元の通常時給」と「移動先の時給（特別時給枠なら+2,000円した後）」を比較し、高い方を採用する
   */
  function calcMoverIntervalYenJS_(rangeStr, originRates, isFromKita, targetRates, isTargetKita, spRangeStr, spBonus) {
    if (!rangeStr || rangeStr.indexOf("-") === -1 || !targetRates) return 0;
    var parts = rangeStr.split("-");
    var sMin = toMin(parts[0]), eMin = toMin(parts[1]);
    if (isNaN(sMin) || isNaN(eMin) || eMin <= sMin) return 0;

    var spS = -1, spE = -1;
    if (spRangeStr && spRangeStr.indexOf("-") !== -1 && spBonus > 0) {
      var spP = spRangeStr.split("-");
      spS = toMin(spP[0]); spE = toMin(spP[1]);
    } else if (spBonus > 0) {
      spS = sMin; spE = eMin;
    }

    var total = 0;
    for (var t = sMin; t < eMin; t += 15) {
      if (t >= 13 * 60 && t < 15 * 60) continue;

      var origH = originRates ? getSlotRateJS_(t, originRates, isFromKita) : 0;
      var targBaseH = getSlotRateJS_(t, targetRates, isTargetKita);
      var bonus = (spS !== -1 && t >= spS && t < spE) ? spBonus : 0;
      var targetEffectiveH = targBaseH + bonus;

      var appliedH = Math.max(origH, targetEffectiveH);
      total += appliedH * 0.25;
    }
    return Math.round(total);
  }

  function recalcAll() {
    var item = STATE.confirmItems[STATE.selectedIdx];
    if (!item) return;

    if (typeof ensureExtraTargetClinicsUI_ === "function") {
      ensureExtraTargetClinicsUI_();
    }

    // 勤務地変更相談で現在シフトがあり、相談時間が未設定（または単一コマのみ）なら現在シフト（まるごと移動）をセット
    var curTimeVal = document.getElementById("currentTimeInput").value;
    var conTimeEl = document.getElementById("consultTimeInput");
    if (STATE.approachType === "勤務地変更相談" && curTimeVal && !conTimeEl.value) {
      conTimeEl.value = curTimeVal;
    }

    updateHourlyInputVisibility_();

    var dateStr = item.dateStr;
    var clinic = stripClinicPrefix_(document.getElementById("clinicSelect").value);
    var dept = STATE.dept;

    var info = getDayCategoryInfo_(dateStr);
    var targetFound = getWageRowFromAllTables_(clinic, dept, info.y, info.m);

    var hasInt = clinicHasInternalMedicineJS_(clinic);
    var clinicLabel = hasInt ? (clinic + "（" + dept + "）") : clinic;

    if (targetFound && targetFound.row && targetFound.row[info.dayCat]) {
      var r = targetFound.row[info.dayCat];
      // 時給入力欄には移動先拠点の基本時給をセット（比較はcalcMoverIntervalYenJS_側で特時加算後に行う）
      document.getElementById("rateAmInput").value = r.am;
      document.getElementById("ratePmInput").value = r.pm;
      document.getElementById("rateNightInput").value = r.night;
      document.getElementById("wageRuleBadge").innerText =
        "💰 時給設定 【" + clinicLabel + " / " + info.dayLabel + "（" + targetFound.sheetName + "）】";
    } else {
      document.getElementById("wageRuleBadge").innerText =
        "💰 時給設定 【" + clinicLabel + " / " + info.dayLabel + "（手動入力）】";
    }

    recalcFromHourlyInputs();
  }

  function recalcFromHourlyInputs() {
    var item = STATE.confirmItems[STATE.selectedIdx];
    if (!item) return;

    var dateStr = item.dateStr;
    var clinic = stripClinicPrefix_(document.getElementById("clinicSelect").value);
    var dept = STATE.dept;
    var absTime = document.getElementById("absenceTimeInput").value;
    var curTime = document.getElementById("currentTimeInput").value;
    var conTime = document.getElementById("consultTimeInput").value || curTime || absTime;
    var fromClinic = stripClinicPrefix_(document.getElementById("fromClinicInput").value) || clinic;
    var isSpecial = document.getElementById("specialWageCheck").checked;
    var spBonus = isSpecial ? 2000 : 0;

    var amRate = Number(document.getElementById("rateAmInput").value || 0);
    var pmRate = Number(document.getElementById("ratePmInput").value || 0);
    var nightRate = Number(document.getElementById("rateNightInput").value || 0);
    var consultRates = { am: amRate, pm: pmRate, night: nightRate };

    var info = getDayCategoryInfo_(dateStr);
    var fromFound = getWageRowFromAllTables_(fromClinic, dept, info.y, info.m);
    var fromRates = (fromFound && fromFound.row && fromFound.row[info.dayCat])
      ? fromFound.row[info.dayCat]
      : consultRates;

    var isFromKita = (fromClinic === "北葛西");
    var isTargetKita = (clinic === "北葛西");
    var spRange = (absTime && absTime.indexOf("-") !== -1) ? absTime : conTime;

    var curYen = curTime ? calcIntervalYen(curTime, fromRates, isFromKita, null, 0) : 0;
    var conYen = 0;

    if (STATE.approachType === "勤務地変更相談") {
      conYen = calcMoverIntervalYenJS_(conTime, fromRates, isFromKita, consultRates, isTargetKita, spRange, spBonus);
    } else {
      conYen = calcIntervalYen(conTime, consultRates, isTargetKita, spRange, spBonus);
    }

    document.getElementById("currentDailyWageInput").value = curYen;
    document.getElementById("consultDailyWageInput").value = conYen;

    if (typeof rebuildDraftPreview === "function") {
      rebuildDraftPreview();
    }
  }
</script>
