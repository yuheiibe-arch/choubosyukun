<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --gb-body: #d8d4c8;
      --gb-border: #4a4842;
      --gb-screen-bg: #e8f0d8;
      --gb-screen-dark: #1e2d18;
      --gb-screen-mid: #4a6b3b;
      --gb-screen-light: #c8dcaf;
      --gb-magenta: #9b2256;
      --gb-blue: #204987;
      --gb-gold: #c97a10;
    }
    * { box-sizing: border-box; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }
    body {
      margin: 0; padding: 6px;
      background: var(--gb-body);
      color: var(--gb-screen-dark);
      font-size: 12px;
    }
    .gb-shell {
      border: 3px solid var(--gb-border);
      border-radius: 10px 10px 20px 10px;
      background: #e4e0d4;
      padding: 8px;
      box-shadow: inset -2px -2px 0px #b5b0a2, 3px 3px 0px rgba(0,0,0,0.18);
      height: 795px;
      display: flex;
      flex-direction: column;
    }
    .gb-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--gb-screen-dark); color: #e8f0d8;
      padding: 5px 12px; border-radius: 6px; margin-bottom: 6px;
      font-weight: bold; font-size: 12px; letter-spacing: 0.5px;
    }
    .gb-badge {
      background: var(--gb-magenta); color: #fff;
      padding: 2px 10px; border-radius: 10px; font-size: 11px;
    }
    .gb-main {
      display: grid;
      grid-template-columns: 235px 1fr 365px;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }
    .gb-panel {
      background: var(--gb-screen-bg);
      border: 2px solid var(--gb-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 12px; font-weight: bold;
      color: #fff; background: var(--gb-screen-mid);
      padding: 4px 8px; border-radius: 4px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }

    /* 中央パネルのセクションカード（視覚的グループ化） */
    .sec-card {
      background: #f7fbf0;
      border: 1px solid #b4c7a4;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
    }
    .sec-grid-2 {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px;
      align-items: end;
    }
    .sec-grid-clinic {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: end;
      margin-top: 6px;
    }
    .sec-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .btn-new-entry {
      width: 100%;
      padding: 7px 8px;
      margin-bottom: 6px;
      background: var(--gb-blue);
      color: #fff;
      border: 2px solid #102a52;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 0 #102a52;
      flex-shrink: 0;
    }
    .btn-new-entry:hover { filter: brightness(1.1); }
    .btn-new-entry.active-mode {
      background: var(--gb-magenta);
      border-color: #3a0b1e;
      box-shadow: 0 2px 0 #3a0b1e;
    }

    .item-card {
      background: #f7fbf0;
      border: 2px solid #8ba37b;
      border-radius: 6px;
      padding: 6px 8px; margin-bottom: 6px;
      cursor: pointer; transition: 0.1s;
    }
    .item-card:hover { background: #dcebc7; }
    .item-card.active {
      border: 2px solid var(--gb-magenta);
      background: #fff5f8;
      box-shadow: 2px 2px 0px var(--gb-magenta);
    }
    .item-date { font-weight: bold; font-size: 12px; color: var(--gb-blue); }
    .item-clinic { font-weight: bold; font-size: 13px; margin: 2px 0 0 0; }
    .item-doc { font-size: 11px; color: #333; margin-top: 2px; font-weight: bold; }

    .evidence-box {
      background: #fffde7; border: 1px dashed #e0a800;
      padding: 5px 8px; border-radius: 5px; margin-bottom: 6px;
      font-size: 11.5px; line-height: 1.35;
      flex-shrink: 0;
    }

    .form-label {
      font-weight: bold; font-size: 11px; margin-bottom: 2px;
      display: block; color: #2c3e24; white-space: nowrap;
    }
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; padding: 4px 6px;
      border: 1.5px solid var(--gb-border); border-radius: 4px;
      background: #fff; font-size: 12px; font-weight: bold;
      height: 28px;
    }
    textarea { height: auto; }

    .btn-group { display: flex; gap: 4px; flex-wrap: nowrap; }
    .gb-btn {
      padding: 4px 8px;
      height: 28px;
      border: 1.5px solid var(--gb-border);
      border-radius: 5px;
      background: #fff;
      font-weight: bold; font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1.5px 0 var(--gb-border);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .gb-btn:active { transform: translateY(1.5px); box-shadow: none; }
    .gb-btn.selected {
      background: var(--gb-blue); color: #fff; border-color: #102a52;
    }
    .gb-btn.selected-magenta {
      background: var(--gb-magenta); color: #fff; border-color: #5e1132;
    }

    .doc-candidates {
      height: 88px; overflow-y: auto;
      border: 1.5px solid #8ba37b; border-radius: 4px;
      background: #fff; margin-top: 4px;
    }
    .doc-cand-item {
      padding: 4px 8px; border-bottom: 1px solid #eee;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      font-size: 12px;
    }
    .doc-cand-item:hover { background: #e8f5e9; }
    .doc-shift-tag {
      background: #e3f2fd; color: #0d47a1; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; white-space: nowrap;
    }

    .wage-box {
      background: #dcebc7;
      border: 1.5px solid #4a6b3b;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .hourly-flex {
      display: flex; gap: 6px; margin-top: 4px;
    }
    .hourly-flex > div { flex: 1; }
    .wage-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 5px;
    }

    .action-bar {
      display: flex; gap: 6px; margin-top: 6px; flex-shrink: 0;
    }
    .btn-ok {
      flex: 2; background: var(--gb-magenta); color: #fff;
      font-size: 13.5px; padding: 8px; border: 2px solid #3a0b1e;
      border-radius: 6px; cursor: pointer; font-weight: bold;
      box-shadow: 0 3px 0 #3a0b1e;
    }
    .btn-ok:hover { filter: brightness(1.1); }
    .btn-discard {
      flex: 1; background: #78909c; color: #fff;
      font-size: 11.5px; padding: 8px; border: 2px solid #37474f;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="gb-shell">
    <div class="gb-header">
      <div>🕹️ SHUSEI-KUN SYSTEM [確認リスト補正 ＆ 新規作成パネル]</div>
      <div id="headerStatus" class="gb-badge">データ読込中...</div>
    </div>

    <div class="gb-main">
      <!-- ① 左画面：確認リスト一覧 ＆ 新規作成ボタン -->
      <div class="gb-panel">
        <div class="panel-title">
          <span>📋 1. 確認リスト一覧</span>
          <span id="remainCount">0件</span>
        </div>
        <button type="button" id="newCustomEntryBtn" class="btn-new-entry" onclick="startNewCustomEntry()">
          ➕ 新規で枠を作成・追加する
        </button>
        <div id="leftItemList" style="flex:1; overflow-y:auto;">読み込み中...</div>
      </div>

      <!-- ② 中央画面：3つのカードでスッキリ整理 -->
      <div class="gb-panel">
        <div class="panel-title">
          <span>🔍 2. 拠点・医師・時給設定</span>
          <span id="selectedDateBadge">-</span>
        </div>

        <div id="evidenceBox" class="evidence-box">左のリストから項目を選択してください。</div>

        <!-- 【セクションA】日時・拠点・不在時間 -->
        <div class="sec-card">
          <div class="sec-grid-2">
            <div>
              <label class="form-label">📅 対象日付</label>
              <input type="date" id="targetDateInput" onchange="onTargetDateChanged(this.value)">
            </div>
            <div>
              <label class="form-label">📌 D6募集日からクイック選択</label>
              <select id="d6DateQuickSelect" onchange="if(this.value) onTargetDateChanged(this.value)">
                <option value="">（D6募集日一覧から選択）</option>
              </select>
            </div>
          </div>

          <div class="sec-grid-clinic" id="clinicRowGrid">
            <div>
              <label class="form-label">🗾 エリア</label>
              <div class="btn-group">
                <button type="button" id="areaKantoBtn" class="gb-btn selected" onclick="setAreaToggle('関東')">関東</button>
                <button type="button" id="areaKansaiBtn" class="gb-btn" onclick="setAreaToggle('関西')">関西</button>
              </div>
            </div>
            <div>
              <label class="form-label">🏥 対象拠点名</label>
              <select id="clinicSelect" onchange="onClinicOrDeptChange()"></select>
            </div>
            <div>
              <label class="form-label">🩺 診療科</label>
              <div class="btn-group">
                <button type="button" id="deptPedBtn" class="gb-btn selected" onclick="setDept('小児科')">小児科</button>
                <button type="button" id="deptIntBtn" class="gb-btn" style="display:none;" onclick="setDept('内科')">内科</button>
              </div>
            </div>
          </div>

          <!-- 複数拠点の同時打診（グリッドの外側・横幅いっぱいに配置して崩れを防止） -->
          <div id="extraClinicsMountPoint"></div>

          <div style="margin-top:6px;">
            <label class="form-label">⏰ 不在時間帯（ボタン選択 または 直接入力）</label>
            <div style="display:flex; gap:6px; align-items:center;">
              <div class="btn-group">
                <button type="button" class="gb-btn" onclick="setPresetTime('am')">午前</button>
                <button type="button" class="gb-btn" onclick="setPresetTime('pm')">午後</button>
                <button type="button" class="gb-btn" onclick="setPresetTime('night')">夜間</button>
                <button type="button" class="gb-btn" onclick="setPresetTime('pm_night')">午後・夜間</button>
              </div>
              <input type="text" id="absenceTimeInput" style="flex:1;" placeholder="15:00-18:00" oninput="onTimeRangeChanged()">
            </div>
          </div>
        </div>

        <!-- 【セクションB】アプローチ種別 ＆ 医師検索 -->
        <div class="sec-card">
          <div>
            <label class="form-label">🎯 アプローチ種別</label>
            <div class="btn-group" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px;">
              <button type="button" id="ap_early" class="gb-btn" onclick="setApproach('早出相談')">⏪ 早出</button>
              <button type="button" id="ap_move" class="gb-btn selected-magenta" onclick="setApproach('勤務地変更相談')">🚚 勤務地移動</button>
              <button type="button" id="ap_add" class="gb-btn" onclick="setApproach('個別アプローチ')">➕ 個別(追加)</button>
              <button type="button" id="ap_ext" class="gb-btn" onclick="setApproach('延長相談')">⏩ 延長</button>
            </div>
          </div>

          <div style="margin-top:6px;">
            <label class="form-label">
              👨‍⚕️ 対象医師名（<span id="areaDocLabel" style="color:var(--gb-blue);">関東</span>・<span id="masterDeptLabel" style="color:var(--gb-magenta);">小児科</span>の医師候補から検索 / クリックで現在シフト自動反映）
            </label>
            <div style="display:flex; gap:6px; align-items:center;">
              <input type="text" id="doctorInput" style="flex:1;" placeholder="名字を入力（例：伊藤）" oninput="onDoctorInputTyped()">
              <button type="button" class="gb-btn" style="min-width:56px;" onclick="clearDoctorInput()">クリア</button>
            </div>
            <div id="docCandidatesBox" class="doc-candidates"></div>
          </div>
        </div>

        <!-- 【セクションC】シフト時間 ＆ 時給・日給計算 -->
        <div class="sec-card" style="margin-bottom:0;">
          <div class="sec-grid-3" style="margin-bottom:6px;">
            <div>
              <label class="form-label">移動元拠点</label>
              <input type="text" id="fromClinicInput" placeholder="自動 / 手入力" oninput="recalcAll()">
            </div>
            <div>
              <label class="form-label">現在シフト時間</label>
              <input type="text" id="currentTimeInput" placeholder="09:00-13:00" oninput="recalcFromHourlyInputs()">
            </div>
            <div>
              <label class="form-label">相談シフト時間</label>
              <input type="text" id="consultTimeInput" placeholder="15:00-18:00" oninput="onTimeRangeChanged()">
            </div>
          </div>

          <div class="wage-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span id="wageRuleBadge" style="font-weight:bold; font-size:11px; color:#1e2d18;">💰 時給設定</span>
              <label style="font-weight:bold; font-size:11.5px; cursor:pointer; color:var(--gb-magenta); display:flex; align-items:center; gap:3px;">
                <input type="checkbox" id="specialWageCheck" onchange="recalcFromHourlyInputs()"> ★特別時給（+2,000円/h）
              </label>
            </div>

            <div class="hourly-flex">
              <div id="wrapRateAm">
                <label class="form-label">午前時給(円)</label>
                <input type="number" id="rateAmInput" value="0" step="500" oninput="recalcFromHourlyInputs()">
              </div>
              <div id="wrapRatePm">
                <label class="form-label">午後時給(円)</label>
                <input type="number" id="ratePmInput" value="0" step="500" oninput="recalcFromHourlyInputs()">
              </div>
              <div id="wrapRateNight">
                <label class="form-label">夜間時給(円)</label>
                <input type="number" id="rateNightInput" value="0" step="500" oninput="recalcFromHourlyInputs()">
              </div>
            </div>

            <div class="wage-grid">
              <div>
                <label class="form-label">現在日給(円)</label>
                <input type="number" id="currentDailyWageInput" value="0" oninput="rebuildDraftPreview()">
              </div>
              <div>
                <label class="form-label">相談日給(円)</label>
                <input type="number" id="consultDailyWageInput" value="0" oninput="rebuildDraftPreview()">
              </div>
              <div>
                <label class="form-label">依頼手当(円)</label>
                <input type="number" id="allowanceInput" value="10000" oninput="rebuildDraftPreview()">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ③ 右画面：文案レビュー＆移動実行 -->
      <div class="gb-panel">
        <div class="panel-title">
          <span>✉️ 3. 文案レビュー＆移動</span>
        </div>

        <div style="margin-bottom:6px;">
          <label class="form-label">👤 担当者</label>
          <select id="staffSelect" onchange="rebuildDraftPreview()"></select>
        </div>

        <div style="flex:1; display:flex; flex-direction:column; margin-bottom:6px;">
          <label class="form-label">📝 送信文案プレビュー（直接編集も可能です）</label>
          <textarea id="draftPreview" style="flex:1; min-height:360px; font-weight:normal; line-height:1.45;"></textarea>
        </div>

        <div>
          <label class="form-label">📌 『アプローチシート』作業メモ転記内容</label>
          <input type="text" id="memoPreview" style="background:#eef5e6;">
        </div>

        <div class="action-bar">
          <button type="button" class="btn-ok" id="commitBtn" onclick="commitCurrentItem()">
            ⭕ OK（文案・Slackレビューへ移す）
          </button>
          <button type="button" class="btn-discard" id="discardBtn" onclick="discardCurrentItem()">
            🗑️ 消す
          </button>
        </div>
      </div>
    </div>
  </div>

  <?!= includeHtml_('08b_Shuseikun_JS_View'); ?>
  <?!= includeHtml_('08c_Shuseikun_JS_Calc'); ?>
  <?!= includeHtml_('08d_Shuseikun_JS_DraftAndCommit'); ?>
</body>
</html>
